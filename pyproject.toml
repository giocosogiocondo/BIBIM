[project]
name = "bibim"
version = "3.4.7.2"
description = "Document-driven IFC-to-SQLite semantic views, independent entity validation, and local Text-to-SQL pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ifcopenshell==0.8.5",
]

[project.scripts]
bibim-views = "ifc_sql_views.pipeline:main"

[tool.black]
line-length = 99
target-version = ["py312"]
extend-exclude = "(\\.venv|\\.tools|outputs_v|logs)"

[tool.ruff]
line-length = 99
target-version = "py312"
extend-exclude = [".venv", ".tools", "outputs_v3_4_5", "logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Standalone catalog scripts bootstrap the project path before local imports.
"tools/build_column_description_catalog.py" = ["E402"]
